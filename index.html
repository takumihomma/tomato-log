<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#12131C" />
    <meta name="description" content="完全ローカルファーストの音声入力対応ライフログ PWA アプリ" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Tomato Log - ライフログ PWA</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0d0f12; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #ff4757; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 1.2rem; font-size: 0.95rem; font-weight: 500; color: #a1a1aa;">Tomato Log 読み込み中...</p>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        // SW更新時のみリロード
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing && navigator.serviceWorker.controller) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              reg.update();
            })
            .catch((err) => console.error('ServiceWorker error:', err));
        });
      }
    </script>
  </body>
</html>
